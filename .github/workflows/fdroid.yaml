name: Generate F-Droid repo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  apps:
    name: "Generate repo from apps listing"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git fetch origin main repo || true
          repair_repo=false

          if git show-ref --verify --quiet refs/remotes/origin/repo; then
            root=$(git rev-list --max-parents=0 origin/repo | head -n1)
            if git merge-base --is-ancestor "$root" origin/main; then
              echo "repo branch shares history with main, will recreate as orphan."
              repair_repo=true
            fi
          fi

          if [ "$repair_repo" = true ]; then
            git worktree add --orphan fdroid
            git archive origin/repo | tar -x -C fdroid
          elif git show-ref --verify --quiet refs/remotes/origin/repo; then
            git worktree add fdroid origin/repo
          else
            git worktree add --orphan fdroid
            git -C fdroid commit --allow-empty -m "init repo branch"
          fi

          echo "${{ secrets.KEYSTORE_P12 }}" | base64 -d > fdroid/keystore.p12
          echo "${{ secrets.CONFIG_YML }}" | base64 -d > fdroid/config.yml

          nix develop . --command bun update.ts

          git -C fdroid add -A releases.json repo metadata

          git -C fdroid commit -m "update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "no changes"

          git -C fdroid push --force origin HEAD:repo
