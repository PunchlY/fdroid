name: Generate F-Droid repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  apps:
    name: "Generate repo from apps listing"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Restore bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Restore .cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cache-

      - name: Setup Git configurations
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials
          git config --global user.name github-actions[bot]
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Save packages from gc
        if: success()
        run: nix profile add .#saveFromGC

      - name: Build
        run: |
          git fetch origin repo || true

          if git show-ref --verify --quiet refs/remotes/origin/repo; then
            git clone --depth 1 --branch repo "$(git remote get-url origin)" fdroid
          else
            mkdir fdroid
          fi

          echo "${{ secrets.KEYSTORE_P12 }}" | base64 -d > fdroid/keystore.p12
          echo "${{ secrets.CONFIG_YML }}" | base64 -d > fdroid/config.yml

          chmod 0600 fdroid/keystore.p12 fdroid/config.yml

          nix develop . --command just

      - name: Publish
        run: |
          rm -rf fdroid/.git

          git -C fdroid init

          git -C fdroid add -A repo tmp/apkcache.json _redirects ':(exclude)repo/*.apk'
          git -C fdroid commit -m "update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git -C fdroid branch -M repo
          git -C fdroid remote add origin "$(git remote get-url origin)"
          git -C fdroid push --force origin HEAD:repo

      - name: Cleanup .cache cache
        if: success()
        run: |
          set +e
          gh cache list \
            --ref "$GITHUB_REF" \
            --limit 100 \
            --json id,key \
            --jq '.[] | select(.key | startswith("cache-")) | .id' |
          while read -r id; do
            gh cache delete "$id"
          done
